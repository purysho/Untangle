appId: com.firstcurrent.untangle
productName: Untangle
copyright: Copyright © 2026 Oliver Mclennan
asar: true
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - desktop/**
  - build/icon.png
  - package.json
  - "!node_modules/**"
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
win:
  icon: build/icon.ico
  target:
    - nsis
    - portable
nsis:
  artifactName: "${productName}-${version}-windows-${arch}-setup.${ext}"
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Untangle
  deleteAppDataOnUninstall: false
portable:
  artifactName: "${productName}-${version}-windows-${arch}-portable.${ext}"
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  identity: null
linux:
  icon: build/icon.png
  category: Office
  target:
    - AppImage
    - deb
  executableName: untangle
