name: Desktop release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - desktop/**
      - build/**
      - scripts/smoke-desktop.mjs
      - electron-builder.yml
      - package.json
      - package-lock.json
      - vite.config.ts
      - .github/workflows/desktop-release.yml
permissions:
  contents: read
concurrency:
  group: desktop-release
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
            args: --win --x64
            executable: release/win-unpacked/Untangle.exe
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            args: --linux --x64
            executable: release/linux-unpacked/untangle
          - os: macos-15-intel
            platform: macos
            arch: x64
            args: --mac --x64
            executable: release/mac/Untangle.app/Contents/MacOS/Untangle
          - os: macos-15
            platform: macos
            arch: arm64
            args: --mac --arm64
            executable: release/mac-arm64/Untangle.app/Contents/MacOS/Untangle
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package -- ${{ matrix.args }}
      - name: Smoke-test packaged Linux app
        if: runner.os == 'Linux'
        env:
          UNTANGLE_EXECUTABLE: ${{ matrix.executable }}
        run: xvfb-run --auto-servernum npm run test:desktop
      - name: Smoke-test packaged Windows or macOS app
        if: runner.os != 'Linux'
        env:
          UNTANGLE_EXECUTABLE: ${{ matrix.executable }}
        run: npm run test:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.zip
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: downloads
      - name: Publish complete release with checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v${version}"
          (cd downloads && sha256sum * > SHA256SUMS.txt)
          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "Release $tag is already published; existing downloads are immutable. Bump package.json version for a new release."
              exit 0
            fi
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "Untangle ${version}" --draft --notes-file docs/DESKTOP_RELEASE_NOTES.md
          fi
          gh release upload "$tag" downloads/* --clobber
          gh release edit "$tag" --target "$GITHUB_SHA" --draft=false --latest
